<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Prep Planner</title>
<meta name="description" content="Plan a week of batch-cooked meals that fit your goals, with a grocery list and recipes.">
<meta name="theme-color" content="#2E5A43">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal Prep">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F8F1; --card:#FFFFFF; --ink:#18211C; --muted:#5A675E;
  --basil:#2E5A43; --basil-ink:#FFFFFF; --celery:#E1EBD8; --mustard:#E0A526; --tomato:#B8482A; --line:#CCD6C4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#111713; --card:#19211C; --ink:#E7EEE6; --muted:#A0ADA3;
  --basil:#8FC3A2; --basil-ink:#0F1A13; --celery:#203029; --mustard:#E8B341; --tomato:#E88866; --line:#33413A;
}}
:root[data-theme="dark"]{
  --paper:#111713; --card:#19211C; --ink:#E7EEE6; --muted:#A0ADA3;
  --basil:#8FC3A2; --basil-ink:#0F1A13; --celery:#203029; --mustard:#E8B341; --tomato:#E88866; --line:#33413A;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;line-height:1.12;margin:0}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.2rem;font-weight:600}
p{margin:.5em 0}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding:1rem 1.15rem 6rem}

.top{display:flex;align-items:center;gap:1rem;padding:.4rem 0 1rem}
.top b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.05rem;margin-right:auto}
.linkbtn{background:none;border:0;color:var(--muted);font:500 .9rem "Public Sans",sans-serif;cursor:pointer;padding:.3rem;text-decoration:underline}
.progress{height:8px;background:var(--celery);border-radius:99px;overflow:hidden;margin-bottom:.4rem}
.progress i{display:block;height:100%;background:var(--basil);border-radius:99px;transition:width .3s}
.stepcount{font-size:.88rem;color:var(--muted);margin-bottom:1.4rem}

.q{margin-bottom:.4rem}
.sub{color:var(--muted);margin:.4rem 0 1.4rem}
.group{margin-top:1.6rem}
.group > .gl{font-weight:700;margin-bottom:.15rem}
.group > .gh{font-size:.9rem;color:var(--muted);margin-bottom:.6rem}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.7rem}
.cards.two{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.choice{display:flex;gap:.8rem;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:1rem;cursor:pointer;font:inherit;color:inherit;width:100%;min-height:64px}
.choice:hover{border-color:var(--basil)}
.choice[aria-pressed="true"]{border-color:var(--basil);background:var(--celery);box-shadow:inset 0 0 0 1px var(--basil)}
.choice .ic{font-size:1.6rem;line-height:1}
.choice b{display:block;font-weight:700}
.choice small{display:block;color:var(--muted);font-size:.88rem;margin-top:.15rem;line-height:1.35}
.choice.compact{padding:.7rem .9rem;min-height:0;align-items:center}

.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.45rem .95rem;font:500 1rem "Public Sans",sans-serif;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--basil);border-color:var(--basil);color:var(--basil-ink)}

label.f{display:block;font-weight:700;margin-bottom:.9rem}
label.f small{display:block;font-weight:400;color:var(--muted);font-size:.88rem}
input[type=text],input[type=number],input[type=email],input[type=password],textarea{display:block;width:100%;margin-top:.35rem;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:.7rem .8rem}
input:focus,textarea:focus{border-color:var(--basil);outline:none}
textarea{min-height:96px;resize:vertical}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:480px){.pair{grid-template-columns:1fr}}
.unit{display:flex;gap:.4rem;align-items:stretch}
.unit input{flex:1}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;margin-top:.35rem}
.seg button{border:0;background:var(--card);color:var(--ink);font:600 .95rem "Public Sans",sans-serif;padding:.55rem .85rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--basil);color:var(--basil-ink)}

.stepper{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:.75rem 1rem;margin-bottom:.6rem}
.stepper .t b{display:block}
.stepper .t small{color:var(--muted);font-size:.86rem}
.stepper .ctl{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.stepper .ctl button{width:44px;height:44px;border-radius:50%;border:2px solid var(--basil);background:var(--card);color:var(--basil);font:700 1.4rem/1 "Public Sans",sans-serif;cursor:pointer}
.stepper .ctl button:disabled{opacity:.35;cursor:default}
.stepper .ctl output{min-width:2ch;text-align:center;font:800 1.4rem "Bricolage Grotesque",sans-serif}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:.8rem 1.15rem calc(.8rem + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:760px;margin:0 auto;display:flex;gap:.7rem}
.btn{font:700 1.05rem "Public Sans",sans-serif;border-radius:12px;padding:.85rem 1.3rem;cursor:pointer;border:2px solid var(--basil);background:var(--card);color:var(--basil)}
.btn.primary{background:var(--basil);color:var(--basil-ink);flex:1}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{width:100%;font-size:1.15rem;padding:1rem}
.err{color:var(--tomato);font-weight:600;margin-top:.8rem}

/* targets */
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin:1rem 0}
.tg{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:1rem}
.tg strong{display:block;font:800 2rem/1 "Bricolage Grotesque",sans-serif;color:var(--basil)}
.tg span{font-weight:700}
.tg small{display:block;color:var(--muted);font-size:.85rem;margin-top:.3rem;line-height:1.35}
.meals{background:var(--card);border:2px solid var(--line);border-radius:12px;overflow:hidden;margin:1rem 0}
.meals div{display:flex;justify-content:space-between;gap:1rem;padding:.75rem 1rem;border-bottom:1px solid var(--line)}
.meals div:last-child{border-bottom:0}
.meals em{font-style:normal;color:var(--muted);text-align:right}
.callout{background:var(--celery);border-radius:12px;padding:1rem 1.1rem;margin:1rem 0}
.edits{display:flex;flex-wrap:wrap;gap:.4rem .8rem;margin-top:.5rem}

/* plan */
.plan{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:1.2rem 1.3rem;margin-top:1rem;overflow-wrap:anywhere}
.plan h1{font-size:1.7rem;margin:.2rem 0 .6rem}
.plan h2{font-size:1.4rem;margin:1.6rem 0 .5rem;padding-top:1rem;border-top:2px solid var(--line)}
.plan h2:first-child{border-top:0;padding-top:0;margin-top:0}
.plan h3{margin:1.1rem 0 .3rem}
.plan ul,.plan ol{padding-left:1.3rem;margin:.4rem 0}
.plan li{margin:.25rem 0}
.plan .tw{overflow-x:auto;margin:.6rem 0}
.plan table{border-collapse:collapse;width:100%;font-size:.95rem}
.plan th,.plan td{border-bottom:1px solid var(--line);padding:.45rem .5rem;text-align:left;vertical-align:top}
.plan th{background:var(--celery)}
.plan li.task{list-style:none;margin-left:-1.3rem}
.plan li.task::before{content:"☐ ";color:var(--basil)}
.thinking{display:flex;gap:.7rem;align-items:center;color:var(--muted);font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mustard);animation:p 1s infinite alternate}
@keyframes p{to{opacity:.25;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.progress i{transition:none}}
.adjust{margin-top:1.4rem}
.row{display:flex;gap:.6rem;margin-top:.6rem}
.row input{margin:0}
pre.brief{white-space:pre-wrap;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:1rem;font:.85rem/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:360px;overflow:auto}
.hide{display:none!important}
.mode{display:grid;gap:.8rem;margin-top:1.2rem}
.mode .choice{padding:1.2rem 1.2rem;min-height:96px}
.mode .choice b{font-size:1.15rem}
.qf{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:1.1rem 1.1rem 1.3rem;margin-bottom:1rem}
.qf > h3{margin-bottom:.8rem}
.qf .choice{background:var(--paper)}
.qf .chip{background:var(--paper)}
.qf .group:first-of-type{margin-top:.6rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin:.8rem 0 0}
.tags span{background:var(--celery);border-radius:999px;padding:.25rem .75rem;font-size:.92rem;font-weight:500}
.saved{font-size:.88rem;color:var(--muted);margin-top:.8rem}
.welcome{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:1.2rem}
.mealcfg{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.9rem 1rem .4rem;margin-bottom:.8rem}
.mealcfg.off{opacity:.75;padding-bottom:.9rem}
.mealcfg .mh{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.6rem}
.mealcfg .stepper{background:var(--paper)}
.mealtabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem}
.mealtabs span{padding:.3rem .8rem;border-radius:99px;border:2px solid var(--line);font-size:.88rem;font-weight:600;color:var(--muted)}
.mealtabs span.on{background:var(--basil);color:var(--basil-ink);border-color:var(--basil)}
.mealtabs span.done{color:var(--basil);border-color:var(--basil)}
.mealtabs span.done::before{content:"✓ "}
.pickcfg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:560px){.pickcfg{grid-template-columns:1fr}}
.wrapseg{display:flex;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.9rem;margin-top:.6rem}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:1rem 1.05rem;display:flex;flex-direction:column;gap:.55rem}
.opt.sel{border-color:var(--basil);background:var(--celery);box-shadow:inset 0 0 0 1px var(--basil)}
.opt .nm{font:600 1.2rem/1.2 "Bricolage Grotesque",sans-serif}
.opt .meta{font-size:.88rem;color:var(--muted)}
.opt .nums{display:flex;gap:1.2rem}
.opt .nums strong{display:block;font:800 1.5rem/1 "Bricolage Grotesque",sans-serif;color:var(--basil)}
.opt .nums span{font-size:.8rem;color:var(--muted)}
.opt .portion{font-size:.88rem;font-weight:600}
.tagrow{display:flex;flex-wrap:wrap;gap:.3rem}
.tagrow span{font-size:.78rem;font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:.1rem .55rem}
.opt details{font-size:.92rem}
.opt summary{cursor:pointer;color:var(--basil);font-weight:600}
.opt details ul,.opt details ol{padding-left:1.2rem;margin:.4rem 0}
.pickbtn{margin-top:auto;width:100%}
.morerow{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin-top:1rem}
.tray{margin-top:1.2rem;background:var(--celery);border-radius:12px;padding:.8rem 1rem}
.hint{font-size:.88rem;color:var(--muted)}
.btn.small{padding:.45rem .9rem;font-size:.92rem}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin:1rem 0}
.nbar{margin-bottom:.8rem}
.nbar .lbl{display:flex;justify-content:space-between;gap:1rem;font-size:.92rem}
.nbar .track{position:relative;height:14px;background:var(--celery);border-radius:99px;margin-top:.3rem}
.nbar .track i{display:block;height:100%;border-radius:99px;background:var(--basil)}
.nbar .track i.under{background:var(--mustard)}
.nbar .track i.over{background:var(--tomato)}
.nbar .track em{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.tabs{margin:.4rem 0 1rem}
.dmeal{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.9rem}
.dmeal ul,.dmeal ol{padding-left:1.25rem}
.dmh{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.4rem}
.drow{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem 0;border-top:1px solid var(--line)}
.drow small{display:block;color:var(--muted);font-size:.86rem}
.tw{overflow-x:auto}
table.wk{border-collapse:collapse;width:100%;min-width:640px;font-size:.85rem;background:var(--card)}
table.wk th,table.wk td{border:1px solid var(--line);padding:.45rem;text-align:left;vertical-align:top}
table.wk th{background:var(--celery)}
.gsec{margin:1.2rem 0 .4rem}
.gi{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem 0;border-bottom:1px solid var(--line);font-weight:400;cursor:pointer}
.gi input{width:20px;height:20px;margin-top:.15rem;accent-color:var(--basil)}
.gi em{font-style:normal;color:var(--muted)}
.gi input:checked + span{text-decoration:line-through;color:var(--muted)}
.dactions{display:grid;gap:.6rem}
.person{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:1rem 1.05rem;margin-bottom:.8rem}
.qf .person{background:var(--paper)}
.person.me{background:var(--celery);border-color:var(--celery)}
.person .ph{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.person .ph .hint{margin:0}
.person .seg{flex-wrap:wrap}
.hhres{font-weight:600;color:var(--basil);margin:.8rem 0 0}
.hhres:empty{display:none}
.household-sum{margin:1rem 0}
.opt .blurb{margin:0;font-size:.95rem}
.opt.fun{border-style:dashed}
.opt.shares{box-shadow:inset 5px 0 0 var(--mustard)}
.opt.sel.shares{box-shadow:inset 0 0 0 1px var(--basil),inset 5px 0 0 var(--mustard)}
.sharebox{font-size:.9rem;background:color-mix(in srgb,var(--mustard) 16%,var(--card));border-radius:10px;padding:.5rem .7rem;line-height:1.45}
.sharebox mark{background:var(--mustard);color:#1b1505;font-weight:700;border-radius:4px;padding:0 .3rem}
.genbox{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:1rem;margin-top:.9rem}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
.sheetin{background:var(--card);border-radius:16px;padding:1.3rem;max-width:560px;width:100%}
.sheetin .row{flex-wrap:wrap}
.sheetin .row .btn{flex:1}
/* web app additions */
.top .acct{padding:.4rem .85rem;font-size:.9rem}
.pitch{margin-top:1.2rem;border-color:var(--basil)}
.pitch h3{margin-bottom:.3rem}
.pitch .row,.callout .row{flex-wrap:wrap}
.callout .btn.small{margin-top:.2rem}
.panel summary{cursor:pointer}
.linkbtn.danger{color:var(--tomato)}
.btn.danger-bg{background:var(--tomato);border-color:var(--tomato);color:#fff}
#authForm{max-width:460px}
#authForm input{font-size:1.05rem}
.toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:.7rem 1.1rem;border-radius:12px;font-weight:600;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 2rem);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.installhint{position:fixed;left:.8rem;right:.8rem;bottom:calc(.8rem + env(safe-area-inset-bottom,0px));background:var(--card);border:2px solid var(--basil);border-radius:14px;padding:.8rem 1rem;display:flex;gap:.8rem;align-items:center;justify-content:space-between;z-index:30;font-size:.95rem;box-shadow:0 6px 24px rgba(0,0,0,.15)}
.app a{color:var(--basil);font-weight:600}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><b>🥘 Meal prep planner</b><button class="linkbtn" id="restart">Start over</button><button class="btn small acct" id="acctBtn">Sign in</button></div>
  <div id="prog"><div class="progress"><i id="bar" style="width:0"></i></div><div class="stepcount" id="count"></div></div>
  <main id="screen"></main>
  <p class="hint" style="margin-top:2rem">Nutrition numbers are estimates for planning, not medical advice.</p>
</div>
<div class="nav" id="nav"><div class="in">
  <button class="btn" id="back">Back</button>
  <button class="btn primary" id="next">Next</button>
</div></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
